<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Slider App</title>

<link rel="stylesheet" href="css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<header class="topbar">
    <div class="logo">📘 Slider</div>
</header>

<div class="app">

    <aside class="sidebar">
        <div class="menu-title">NAVEGACIÓN</div>
        <div class="menu-item active">🏠 Inicio</div>

        <div class="menu-title">PRÁCTICAS</div>
        <div class="menu-item active">🪅 Slider</div>

    
    </aside>

    <main class="main">

        <div class="page-header">
            <h2>🪅 Carrusel de Imágenes</h2>
            <p>Slider dinámico con AJAX</p>
        </div>

        <!-- SLIDER -->
        <div class="card slider-card">

            <button class="nav left" onclick="prevImage()">❮</button>

            <img src="https://picsum.photos/1200/400" class="slider-img" id="slider">

            <div class="overlay">
                <h3 id="titulo">Sin imágenes</h3>
            </div>

            <button class="nav right" onclick="nextImage()">❯</button>

        </div>

        <!-- SUBIR -->
        <div class="card upload-card">

            <input type="file" id="fileInput">
            <input type="text" id="nombre" placeholder="Nombre de la imagen">

            <button onclick="subirImagen()">Subir Imagen</button>

        </div>

        <!-- GALERIA -->
        <div class="card gallery">

            <h3>Imágenes</h3>
            <button onclick="cargarImagenes()">Actualizar</button>

            <div class="grid" id="galeria"></div>

        </div>

    </main>

</div>

<script>

let actualId = 0;


// 🔥 MOSTRAR IMAGEN
function mostrarImagen(img){

    actualId = img.id;

    document.getElementById("slider").src =
        img.ruta + "?t=" + new Date().getTime();

    document.getElementById("titulo").innerText =
        img.nombre;

    document.getElementById("galeria").innerHTML = `

        <div class="img-card">

            <img src="${img.ruta}?t=${new Date().getTime()}">

            <h4>${img.nombre}</h4>

            <button onclick="ver(${img.id})">
                Ver
            </button>

            <button onclick="eliminar(${img.id})">
                Eliminar
            </button>

        </div>

    `;
}


// 🔥 CARGAR PRIMERA
function cargarImagenes(){

    fetch("obtener.php?direccion=primera")

    .then(res => res.json())

    .then(data => {

        if(data.length > 0){

            mostrarImagen(data[0]);

        }

    });

}


// 🔥 SIGUIENTE
function nextImage(){

    fetch(`obtener.php?actual=${actualId}&direccion=siguiente`)

    .then(res => res.json())

    .then(data => {

        if(data.length > 0){

            mostrarImagen(data[0]);

        }

    })

    .catch(error => console.log(error));

}


// 🔥 ANTERIOR
function prevImage(){

    fetch(`obtener.php?actual=${actualId}&direccion=anterior`)

    .then(res => res.json())

    .then(data => {

        if(data.length > 0){

            mostrarImagen(data[0]);

        }

    })

    .catch(error => console.log(error));

}


// 🔥 VER
function ver(id){

    fetch(`obtener.php?actual=${id}&direccion=ver`)

    .then(res => res.json())

    .then(data => {

        if(data.length > 0){

            mostrarImagen(data[0]);

        }

    });

}


// 🔥 ELIMINAR
function eliminar(id){

    fetch("eliminar.php", {

        method: "POST",

        headers: {
            "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body: "id=" + id

    })

    .then(res => res.json())

    .then(data => {

        alert(data.mensaje);

        cargarImagenes();

    });

}


// 🔥 SUBIR
function subirImagen(){

    let file =
        document.getElementById("fileInput").files[0];

    let nombre =
        document.getElementById("nombre").value;

    if(!file || !nombre){

        alert("Selecciona imagen y nombre");

        return;

    }

    let formData = new FormData();

    formData.append("imagen", file);

    formData.append("nombre", nombre);

    fetch("subir.php", {

        method: "POST",

        body: formData

    })

    .then(res => res.json())

    .then(data => {

        alert(data.mensaje);

        cargarImagenes();

    });

}


// 🔥 INICIAR
cargarImagenes();

</script>

</body>
</html>
