<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
}

.card{

    width:400px;
    background:#1e293b;
    padding:35px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,.4);
    color:white;

}

.card h2{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group input{

    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#334155;
    color:white;
    font-size:15px;

}

.input-group small{

    display:block;
    margin-top:6px;
    color:#f87171;
    font-size:13px;

}

.valido{
    color:#4ade80 !important;
}

button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:.3s;

}

button:hover{
    background:#1d4ed8;
}

.login-link{

    text-align:center;
    margin-top:20px;

}

.login-link a{
    color:#60a5fa;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

    <h2>Crear Cuenta</h2>

    <div class="input-group">
        <input type="text" id="nombre" placeholder="Nombre">
    </div>

    <div class="input-group">
        <input type="email" id="correo" placeholder="Correo">
        <small id="msgCorreo"></small>
    </div>

    <div class="input-group">
        <input type="password" id="password" placeholder="Contraseña">
        <small id="msgPass"></small>
    </div>

    <button onclick="registro()">Registrarse</button>

    <div class="login-link">
        ¿Ya tienes cuenta?
        <a href="login.html">Iniciar sesión</a>
    </div>

</div>

<script>

// VALIDAR CORREO
document.getElementById("correo").addEventListener("input", function(){

    let correo = this.value;

    let regex = /^[^ ]+@(gmail|hotmail|outlook)\.com$/;

    if(regex.test(correo)){

        document.getElementById("msgCorreo").innerHTML = "Correo válido";
        document.getElementById("msgCorreo").className = "valido";

    }else{

        document.getElementById("msgCorreo").innerHTML = "Coloca un correo válido";
        document.getElementById("msgCorreo").className = "";

    }

});

// VALIDAR PASSWORD
document.getElementById("password").addEventListener("input", function(){

    let pass = this.value;

    let errores = [];

    if(pass.length < 8){
        errores.push("mínimo 8 caracteres");
    }

    if(!/[A-Z]/.test(pass)){
        errores.push("falta mayúscula");
    }

    if(!/[0-9]/.test(pass)){
        errores.push("falta número");
    }

    if(!/[\W]/.test(pass)){
        errores.push("falta caracter especial");
    }

    if(errores.length == 0){

        document.getElementById("msgPass").innerHTML = "Contraseña segura";
        document.getElementById("msgPass").className = "valido";

    }else{

        document.getElementById("msgPass").innerHTML = errores.join(", ");
        document.getElementById("msgPass").className = "";

    }

});

// REGISTRO
function registro(){

    let nombre = document.getElementById("nombre").value.trim();
    let correo = document.getElementById("correo").value.trim();
    let password = document.getElementById("password").value.trim();

    if(nombre == "" || correo == "" || password == ""){

        alert("Completa todos los campos");
        return;

    }

    fetch("registro.php", {

        method: "POST",

        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },

        body:
        "nombre=" + encodeURIComponent(nombre) +
        "&correo=" + encodeURIComponent(correo) +
        "&password=" + encodeURIComponent(password)

    })

    .then(response => response.json())

    .then(data => {

        alert(data.mensaje);

        if(data.status === "ok"){

            window.location = "login.html";

        }

    })

    .catch(error => {

        console.log(error);
        alert("Error en conexión con el servidor");

    });

}

</script>

</body>
</html>
