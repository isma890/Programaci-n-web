<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
}

.card{

    width:380px;
    background:#1e293b;
    padding:35px;
    border-radius:20px;
    color:white;
    box-shadow:0 0 30px rgba(0,0,0,.4);

}

.card h2{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

input{

    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#334155;
    color:white;
    margin-top:8px;

}

small{

    display:block;
    margin-top:6px;
    color:#f87171;
    font-size:13px;

}

.valido{
    color:#4ade80 !important;
}

button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    margin-top:15px;
    cursor:pointer;
    transition:.3s;

}

button:hover{
    background:#1d4ed8;
}

p{
    margin-top:20px;
    text-align:center;
}

a{
    color:#60a5fa;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

    <h2>Iniciar Sesión</h2>

    <div class="input-group">

        <input type="email" id="correo" placeholder="Correo">
        <small id="msgCorreo"></small>

    </div>

    <div class="input-group">

        <input type="password" id="password" placeholder="Contraseña">
        <small id="msgPass"></small>

    </div>

    <button onclick="login()">Ingresar</button>

    <p>
        ¿No tienes cuenta?
        <a href="registro.html">Crear cuenta</a>
    </p>

</div>

<script>

// VALIDAR CORREO
document.getElementById("correo").addEventListener("input", function(){

    let correo = this.value;

    let regex = /^[^ ]+@(gmail|hotmail|outlook)\.com$/;

    if(regex.test(correo)){

        document.getElementById("msgCorreo").innerHTML = "Correo válido";
        document.getElementById("msgCorreo").className = "valido";

    }else{

        document.getElementById("msgCorreo").innerHTML = "Ingresa un correo válido";
        document.getElementById("msgCorreo").className = "";

    }

});

// VALIDAR PASSWORD
document.getElementById("password").addEventListener("input", function(){

    let pass = this.value;

    let errores = [];

    if(pass.length < 8){
        errores.push("mínimo 8 caracteres");
    }

    if(!/[A-Z]/.test(pass)){
        errores.push("falta mayúscula");
    }

    if(!/[0-9]/.test(pass)){
        errores.push("falta número");
    }

    if(!/[\W]/.test(pass)){
        errores.push("falta caracter especial");
    }

    // DETECTAR SQL INJECTION
    let sqlRegex = /('|--|;|\/\*|\*\/| OR | AND )/i;

    if(sqlRegex.test(pass)){
        errores.push("caracteres no permitidos");
    }

    if(errores.length == 0){

        document.getElementById("msgPass").innerHTML = "Contraseña válida";
        document.getElementById("msgPass").className = "valido";

    }else{

        document.getElementById("msgPass").innerHTML = errores.join(", ");
        document.getElementById("msgPass").className = "";

    }

});

// LOGIN
function login(){

    let correo = document.getElementById("correo").value.trim();
    let password = document.getElementById("password").value.trim();

    // CAMPOS VACÍOS
    if(correo === "" || password === ""){

        alert("Completa todos los campos");
        return;

    }

    // VALIDAR CORREO
    let regexCorreo = /^[^ ]+@(gmail|hotmail|outlook)\.com$/;

    if(!regexCorreo.test(correo)){

        alert("Correo inválido");
        return;

    }

    // DETECTAR SQL INJECTION
    let sqlRegex = /('|--|;|\/\*|\*\/| OR | AND )/i;

    if(sqlRegex.test(correo) || sqlRegex.test(password)){

        alert("Entrada no permitida");
        return;

    }

    fetch("login.php", {

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:
        "correo=" + encodeURIComponent(correo) +
        "&password=" + encodeURIComponent(password)

    })

    .then(response => response.json())

    .then(data => {

        alert(data.mensaje);

        if(data.status === "ok"){

            window.location.href = "slider.php";

        }

    })

    .catch(error => {

        console.log(error);
        alert("Error en login");

    });

}

</script>

</body>
</html>
